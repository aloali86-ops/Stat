<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Футбольная статистика</title>
<style>
:root{--bg:#f3f5f7;--cd:#fff;--tx:#14202b;--mu:#6b7a88;--ac:#0a8f5b;--bd:#dde3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--cd:#18232e;--tx:#e8eef3;--mu:#8fa0af;--ac:#2fd08a;--bd:#2a3846}}
:root[data-theme="dark"]{--bg:#0f1720;--cd:#18232e;--tx:#e8eef3;--mu:#8fa0af;--ac:#2fd08a;--bd:#2a3846}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:10px;max-width:900px;margin:auto}
h1{font-size:19px;margin:4px 0}h3{margin:0 0 8px;font-size:15px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid label{font-size:12px;color:var(--mu)}
select,input,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
select,input{width:100%}button{cursor:pointer;width:auto}button.pr{background:var(--ac);color:#fff;border-color:var(--ac)}button.dg{color:#d33}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}td small{display:block;color:var(--mu);font-size:11px}
td.g{color:var(--ac);font-weight:700}td.w{color:var(--ac);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.tiles b{display:block;font-size:22px;color:var(--ac)}.tiles span{font-size:11px;color:var(--mu)}
small{color:var(--mu)}details{border-top:1px solid var(--bd);padding:6px 0}summary{cursor:pointer;padding:4px 0}dialog{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:min(440px,94vw);max-height:88vh;overflow:auto}
dialog label{display:block;margin:6px 0;font-size:12px;color:var(--mu)}.cr{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;margin:4px 0}
</style></head><body><div id="app"></div><dialog id="dlg"></dialog>
<script>
const $=id=>document.getElementById(id),K='fstats1',Z={sq:0,gp:0,min:0,g:0,a:0,yc:0,rc:0};
const MN=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=x=>parseInt(x)||0,fd=d=>d.split('-').reverse().join('.'),today=()=>new Date().toISOString().slice(0,10);
let S={pl:[],a:'',b:'',y:'',m:'',d:''},MEM={c:[],t:[]};try{MEM=JSON.parse(localStorage.getItem('fstats_mem'))||MEM}catch(e){}
const allClubs=()=>[...new Set(MEM.c.concat(S.pl.flatMap(p=>(p.cs||[]).map(e=>e.c).concat((p.clubs||[]).map(c=>c.n)))))].filter(Boolean).sort();
const allTeams=()=>[...new Set(MEM.t.concat(S.pl.flatMap(p=>(p.ns||[]).map(e=>e.c).concat([p.team]))))].filter(Boolean).sort();
const P=id=>S.pl.find(p=>p.id===id);
function save(){try{localStorage.setItem(K,JSON.stringify(S.pl));localStorage.setItem('fstats_mem',JSON.stringify(MEM))}catch(e){}}
const iso=s=>{s=(s||'').trim();let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=y<=40?2000:1900;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}return /^\d{4}-\d\d-\d\d$/.test(s)?s:''};
const age=(b,d)=>{let y=d.slice(0,4)-b.slice(0,4);if(d.slice(5)<b.slice(5))y--;return y};
function dur(a,b){a=new Date(a);b=new Date(b);let y=b.getUTCFullYear()-a.getUTCFullYear(),m=b.getUTCMonth()-a.getUTCMonth(),d=b.getUTCDate()-a.getUTCDate();if(d<0){m--;d+=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),0)).getUTCDate()}if(m<0){y--;m+=12}return y+' л. '+m+' мес. '+d+' дн. ('+Math.round((b-a)/864e5)+' дн.)'}
function clubOf(p,m){if(m.nat)return p.team||'Сборная';for(const c of p.clubs||[])if(c.f<=m.d&&(!c.t||m.d<=c.t))return c.n;return 'Без клуба'}
function agg(ms){return ms.reduce((r,m)=>{r.sq++;if(m.min>0)r.gp++;r.min+=m.min;r.g+=m.g;r.a+=m.a;r.yc+=m.yc;r.rc+=m.rc;return r},Object.assign({},Z))}
function migrate(){S.pl.forEach(p=>{p.matches=(p.matches||[]).filter(m=>!/^\d+:\d+/.test(String(m.o||'').trim()));if(!p.matches.length)return;p.ns=p.ns||[];p.cs=p.cs||[];const ny=new Set(p.ns.map(e=>String(e.y).slice(0,4))),G2=new Map();
p.matches.forEach(m=>{const y=m.d.slice(0,4);if(m.nat&&ny.has(y))return;const c=m.nat?(p.team||'Сборная'):clubOf(p,m),k=(m.nat?'n':'c')+'|'+y+'|'+c;if(!G2.has(k))G2.set(k,{nat:!!m.nat,y,c,gp:0,min:0,g:0,a:0});const r=G2.get(k);if(m.min>0)r.gp++;r.min+=m.min;r.g+=m.g;r.a+=m.a});
G2.forEach(r=>{(r.nat?p.ns:p.cs).push({y:r.y,c:r.c,gp:r.gp,min:r.min,g:r.g,a:r.a})});p.matches=[];const so=(a,b)=>a.y<b.y?-1:a.y>b.y?1:0;p.ns.sort(so);p.cs.sort(so)})}
function init(){try{S.pl=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}if(!S.pl.length)S.pl=[{id:'p1',name:'Новый игрок',team:'',birth:'',debut:'',end:'',clubs:[],matches:[]}];migrate();save();S.a=S.pl[0].id;R()}
const sel=(id,opts,v,fn)=>`<select onchange="${fn}">${opts.map(o=>`<option value="${esc(o[0])}"${o[0]==v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
function info(p){const t=today(),e=p.end||t,fy=[...yearMap(p).keys()].sort()[0];return `<div><b>${esc(p.name)}</b> · ${esc(p.team||'—')}<br><small>Рожд.: ${p.birth?fd(p.birth)+' ('+age(p.birth,t)+' л.)':'—'}<br>Дебют в футболе: ${p.debut?fd(p.debut)+(p.birth?' ('+age(p.birth,p.debut)+' л.)':''):'не указан'+(fy?' (в статистике с '+fy+' г.)':'')}<br>Завершение карьеры: ${p.end?fd(p.end)+(p.birth?' ('+age(p.birth,p.end)+' л.)':''):'ещё играет'}${p.debut?'<br>В карьере: '+dur(p.debut,e):''}</small></div>`}
function T(title,keys,maps,ps,lab,sub){const two=ps.length>1,cols=two?[['gp','И'],['g','Г'],['a','П']]:[['gp','Игры'],['min','Мин'],['g','Голы'],['a','Пасы'],['yc','ЖК']];
if(!keys.length)return `<div class="card"><h3>${title}</h3><small>Нет данных</small></div>`;
let h=`<div class="card"><h3>${title}</h3><div class="sc"><table>`;if(two)h+=`<tr><th></th>${ps.map(p=>`<th colspan="3">${esc(p.name)}</th>`).join('')}</tr>`;
h+=`<tr><th></th>${ps.map(()=>cols.map(c=>`<th>${c[1]}</th>`).join('')).join('')}</tr>`;
keys.forEach(k=>{h+=`<tr><td>${lab(k)}${sub?`<small>${sub(k)}</small>`:''}</td>${maps.map(mp=>{const a=mp.get(k)||Z;return cols.map(c=>`<td${c[0]=='g'&&a.g?' class="g"':''}>${a[c[0]]}</td>`).join('')}).join('')}</tr>`});
return h+'</table></div></div>'}
const csF=p=>(p.cs||[]).filter(e=>!S.y||String(e.y).slice(0,4)==S.y);
const csT=v=>v.reduce((r,e)=>{for(const k in r)r[k]+=n(e[k]);return r},{gp:0,min:0,g:0,a:0,yc:0,yc2:0,rc:0});
function yearList(){return `<div class="card"><h3>Игроки по годам (клубы + сборная)</h3><small>Голы, пасы, гол+пас и минуты за год. 🏆 — лучший год (больше голов, при равенстве — пасов).</small>`+S.pl.map((p,pi)=>{const Y=new Map(),get=y=>{if(!Y.has(y))Y.set(y,{g:0,a:0,min:0});return Y.get(y)};
natYear(p).forEach((v,k)=>{const r=get(k);r.g+=v.g;r.a+=v.a;r.min+=v.min});p.matches.filter(m=>!m.nat).forEach(m=>{const r=get(m.d.slice(0,4));r.g+=m.g;r.a+=m.a;r.min+=m.min});
(p.cs||[]).forEach(e=>{const r=get(String(e.y).slice(0,4));r.g+=n(e.g);r.a+=n(e.a);r.min+=n(e.min)});
const ks=[...Y.keys()].sort(),best=ks.reduce((b,k)=>{if(b===null)return k;const x=Y.get(k),y=Y.get(b);return x.g>y.g||(x.g==y.g&&x.a>y.a)?k:b},null),t=ks.reduce((t,k)=>{const r=Y.get(k);t.g+=r.g;t.a+=r.a;t.min+=r.min;return t},{g:0,a:0,min:0});
return `<details${pi==0?' open':''}><summary><b>${esc(p.name)}</b> · голов ${t.g} · пасов ${t.a} · г+п ${t.g+t.a}</summary>`+(ks.length?`<div class="sc"><table><tr><th>Год</th><th>Голы</th><th>Пасы</th><th>Г+П</th><th>Мин</th></tr>${ks.map(k=>{const r=Y.get(k),b=k===best&&r.g+r.a>0;return `<tr${b?' style="background:rgba(47,175,120,.15)"':''}><td>${b?'🏆 ':''}${k}</td><td${r.g?' class="g"':''}>${r.g}</td><td>${r.a}</td><td>${r.g+r.a}</td><td>${r.min}</td></tr>`}).join('')}<tr><td><b>Итого</b></td><td><b>${t.g}</b></td><td><b>${t.a}</b></td><td><b>${t.g+t.a}</b></td><td><b>${t.min}</b></td></tr></table></div>`:'<small>Нет данных</small>')+'</details>'}).join('')+'</div>'}
function clubCard(p){const cs=csF(p),t=csT(cs);return `<div class="card"><h3>Клубы — ${esc(p.name)}</h3>`+(cs.length?`<div class="sc"><table><tr><th>Год</th><th>Клуб</th><th>Мин</th><th>Игры</th><th>Голы</th><th>Пасы</th><th></th></tr>${cs.map(e=>`<tr><td>${esc(e.y)}</td><td style="text-align:left">${esc(e.c)}</td><td>${e.min}</td><td>${e.gp}</td><td${e.g?' class="g"':''}>${e.g}</td><td>${e.a}</td><td style="white-space:nowrap"><button onclick="addC('${p.id}',${p.cs.indexOf(e)})">✎</button> <button onclick="delC('${p.id}',${p.cs.indexOf(e)})">×</button></td></tr>`).join('')}<tr><td><b>Итого</b></td><td></td><td><b>${t.min}</b></td><td><b>${t.gp}</b></td><td><b>${t.g}</b></td><td><b>${t.a}</b></td><td></td></tr></table></div>`:'<small>Нет данных. Нажмите «+ Клуб» и внесите статистику за год.</small>')+'</div>'}
function natCard(p){const ns=p.ns||[],ny=new Set(ns.map(e=>String(e.y).slice(0,4))),f=y=>!S.y||String(y).slice(0,4)==S.y;
const rows=ns.map((e,i)=>({y:String(e.y),t:e.c||p.team||'Сборная',min:n(e.min),gp:n(e.gp),g:n(e.g),a:n(e.a),i})).filter(r=>f(r.y)),mm=new Map();
p.matches.filter(m=>m.nat&&!ny.has(m.d.slice(0,4))&&f(m.d)).forEach(m=>{const k=m.d.slice(0,4);if(!mm.has(k))mm.set(k,{y:k,t:p.team||'Сборная',min:0,gp:0,g:0,a:0,i:-1});const r=mm.get(k);if(m.min>0)r.gp++;r.min+=m.min;r.g+=m.g;r.a+=m.a});
const all=rows.concat([...mm.values()]).sort((a,b)=>a.y<b.y?-1:a.y>b.y?1:0),t=all.reduce((t,r)=>{t.min+=r.min;t.gp+=r.gp;t.g+=r.g;t.a+=r.a;return t},{min:0,gp:0,g:0,a:0});
return `<div class="card"><h3>Сборная — ${esc(p.name)}</h3>`+(all.length?`<div class="sc"><table><tr><th>Год</th><th>Сборная</th><th>Мин</th><th>Игры</th><th>Голы</th><th>Пасы</th><th></th></tr>${all.map(r=>`<tr><td>${esc(r.y)}</td><td style="text-align:left">${esc(r.t)}${r.i<0?'<small>из матчей</small>':''}</td><td>${r.min}</td><td>${r.gp}</td><td${r.g?' class="g"':''}>${r.g}</td><td>${r.a}</td><td style="white-space:nowrap">${r.i>=0?`<button onclick="addC('${p.id}',${r.i},'ns')">✎</button> <button onclick="delC('${p.id}',${r.i},'ns')">×</button>`:''}</td></tr>`).join('')}<tr><td><b>Итого</b></td><td></td><td><b>${t.min}</b></td><td><b>${t.gp}</b></td><td><b>${t.g}</b></td><td><b>${t.a}</b></td><td></td></tr></table></div>`:'<small>Нет данных. Нажмите «+ Сборная» и внесите статистику за год.</small>')+'</div>'}
function natYear(p){const mp=new Map(),z=()=>({gp:0,min:0,g:0,a:0,yc:0,yc2:0,rc:0}),ns=p.ns||[],ny=new Set(ns.map(e=>String(e.y).slice(0,4)));
ns.forEach(e=>{const k=String(e.y).slice(0,4);if(!mp.has(k))mp.set(k,z());const r=mp.get(k);r.gp+=n(e.gp);r.min+=n(e.min);r.g+=n(e.g);r.a+=n(e.a);r.yc+=n(e.yc);r.yc2+=n(e.yc2);r.rc+=n(e.rc)});
p.matches.filter(m=>m.nat&&!ny.has(m.d.slice(0,4))).forEach(m=>{const k=m.d.slice(0,4);if(!mp.has(k))mp.set(k,z());const r=mp.get(k);if(m.min>0)r.gp++;r.min+=m.min;r.g+=m.g;r.a+=m.a;r.yc+=m.yc;r.rc+=m.rc});return mp}
const natTot=p=>{const r={gp:0,min:0,g:0,a:0,yc:0,rc:0};natYear(p).forEach((v,k)=>{if(S.y&&k!=S.y)return;r.gp+=v.gp;r.min+=v.min;r.g+=v.g;r.a+=v.a;r.yc+=v.yc+v.yc2;r.rc+=v.rc});return r};
function yearMap(p){const Y=new Map(),get=y=>{if(!Y.has(y))Y.set(y,{gp:0,min:0,g:0,a:0});return Y.get(y)};natYear(p).forEach((v,k)=>{const r=get(k);r.gp+=v.gp;r.min+=v.min;r.g+=v.g;r.a+=v.a});(p.cs||[]).forEach(e=>{const r=get(String(e.y).slice(0,4));r.gp+=n(e.gp);r.min+=n(e.min);r.g+=n(e.g);r.a+=n(e.a)});return Y}
function bestOf(m){let b=null;m.forEach((r,k)=>{if(r.g+r.a>0&&(!b||r.g>b.g||(r.g==b.g&&r.a>b.a)))b={y:k,g:r.g,a:r.a}});return b}
function rankCard(){const YM=S.pl.map(p=>[p,yearMap(p)]),yrs=new Set();YM.forEach(([p,m])=>m.forEach((r,y)=>yrs.add(y)));
const ys=[...yrs].sort().reverse(),ry=yrs.has(S.ry)?S.ry:'',k=S.rs||'ga';
const rows=YM.map(([p,m])=>{let g=0,a=0,gp=0;m.forEach((r,y)=>{if(!ry||y==ry){g+=r.g;a+=r.a;gp+=r.gp}});return{p,g,a,gp,ga:g+a,b:bestOf(m)}}).sort((x,y)=>y[k]-x[k]||y.ga-x.ga||y.g-x.g);
const top=f=>{const mx=Math.max(0,...rows.map(r=>r[f]));return{mx,nm:mx>0?rows.filter(r=>r[f]==mx).map(r=>esc(r.p.name)).join(', '):'—'}},ts=top('g'),ta=top('a'),lb=ry||'за всё время';
const lead=ys.map(y=>{const rs=YM.map(([p,m])=>({p,r:m.get(y)||{g:0,a:0}})),mg=Math.max(...rs.map(x=>x.r.g)),ma=Math.max(...rs.map(x=>x.r.a)),nm=(f,mx)=>mx>0?rs.filter(x=>x.r[f]==mx).map(x=>esc(x.p.name)).join(', ')+' · '+mx:'—';return `<tr><td>${y}</td><td style="text-align:left">${nm('g',mg)}</td><td style="text-align:left">${nm('a',ma)}</td></tr>`}).join('');
const th=(c,l)=>`<th style="cursor:pointer${k==c?';color:var(--ac)':''}" onclick="S.rs='${c}';R()">${l}${k==c?' ▼':''}</th>`;
return `<div class="card"><h3>Рейтинг игроков за год</h3><label style="font-size:12px;color:var(--mu)">Год<select onchange="S.ry=this.value;R()"><option value="">Все годы</option>${ys.map(y=>`<option${y==ry?' selected':''}>${y}</option>`).join('')}</select></label>
<div class="tiles" style="grid-template-columns:1fr 1fr;margin:10px 0"><div><span>⚽ Лучший бомбардир (${lb})</span><b>${ts.mx}</b><span>${ts.nm}</span></div><div><span>🎯 Лучший ассистент (${lb})</span><b>${ta.mx}</b><span>${ta.nm}</span></div></div>
<div class="sc"><table><tr><th>#</th><th style="text-align:left">Игрок</th><th>Игры</th>${th('g','Голы')}${th('a','Пасы')}${th('ga','Г+П')}<th>Лучший год</th></tr>${rows.map((r,i)=>`<tr${i==0&&r.ga>0?' style="background:rgba(47,175,120,.15)"':''}><td>${i==0&&r.ga>0?'🥇':i+1}</td><td style="text-align:left">${ry&&r.b&&r.b.y==ry?'⭐ ':''}${esc(r.p.name)}</td><td>${r.gp}</td><td${r.g?' class="g"':''}>${r.g}</td><td>${r.a}</td><td><b>${r.ga}</b></td><td style="white-space:nowrap">${r.b?'🏆 '+r.b.y+'<small>'+r.b.g+' г · '+r.b.a+' п</small>':'—'}</td></tr>`).join('')}</table></div><small>Клубы + сборная. ⭐ — выбранный год лучший для игрока, 🏆 — лучший год игрока (больше голов, при равенстве — пасов). Нажмите на заголовок колонки для сортировки.</small>
<details style="margin-top:8px"><summary><b>Бомбардиры и ассистенты по годам</b></summary><div class="sc"><table><tr><th>Год</th><th style="text-align:left">⚽ Бомбардир</th><th style="text-align:left">🎯 Ассистент</th></tr>${lead}</table></div></details></div>`}
function R(){if(!P(S.a))S.a=S.pl[0].id;const A=P(S.a),B=S.b&&S.b!==S.a?P(S.b):null,ps=B?[A,B]:[A];
const ys=[...new Set(ps.flatMap(p=>(p.cs||[]).concat(p.ns||[]).map(e=>String(e.y).slice(0,4))))].sort();if(S.y&&!ys.includes(S.y))S.y='';
const ms=ps.map(p=>p.matches.filter(m=>(!S.y||m.d.slice(0,4)==S.y)&&(!S.m||m.d.slice(5,7)==S.m)&&(!S.d||m.d.slice(8)==S.d)));
const G=fn=>{const maps=ps.map((p,i)=>{const mp=new Map();ms[i].forEach(x=>{const k=fn(x,p);if(k===null)return;if(!mp.has(k))mp.set(k,[]);mp.get(k).push(x)});mp.forEach((v,k)=>mp.set(k,agg(v)));return mp});return{maps,keys:[...new Set(maps.flatMap(m=>[...m.keys()]))]}};
const tot=ms.map((a,i)=>{const t=agg(a);return(S.m||S.d)?t:Object.assign(t,natTot(ps[i]))});let h=`<div class="row" style="justify-content:space-between"><h1>⚽ Статистика</h1><div class="row"><button class="pr" onclick="editP()">+ Игрок</button><button onclick="addC(S.a,-1)">+ Клуб</button><button onclick="addC(S.a,-1,'ns')">+ Сборная</button><button onclick="editP(S.a)">✎</button></div></div>
<div class="row" style="margin:6px 0">${S.pl.map(p=>`<button class="${p.id==S.a?'pr':''}" onclick="S.a='${p.id}';S.b='';R()">${esc(p.name)}</button>`).join('')}</div><div class="card grid"><label>Игрок${sel('a',S.pl.map(p=>[p.id,p.name]),S.a,'S.a=this.value;R()')}</label><label>Сравнить с${sel('b',[['','—']].concat(S.pl.filter(p=>p.id!==S.a).map(p=>[p.id,p.name])),S.b,'S.b=this.value;R()')}</label>
<label>Год${sel('y',[['','Все']].concat(ys.map(y=>[y,y])),S.y,'S.y=this.value;R()')}</label>
<label>&nbsp;<button onclick="S.y=S.m=S.d='';R()" style="width:100%">Сбросить</button></label></div>`;
const tl=(l,o)=>`<div style="margin-top:12px"><small>${l}</small><div class="tiles"><div><b>${o.gp}</b><span>игры</span></div><div><b>${o.min}</b><span>минуты</span></div><div><b>${o.g}</b><span>голы</span></div><div><b>${o.a}</b><span>пасы</span></div></div></div>`;
ps.forEach((p,i)=>{const t=tot[i],q=csT(csF(p)),c={gp:t.gp+q.gp,min:t.min+q.min,g:t.g+q.g,a:t.a+q.a};h+=`<div class="card">${info(p)}${tl('Сборная',t)}${tl('Клубы',q)}${tl('Клубы + сборная',c)}</div>`});
if(B){const ct=ps.map((p,i)=>{const q=csT(csF(p)),t=tot[i];return{gp:t.gp+q.gp,min:t.min+q.min,g:t.g+q.g,a:t.a+q.a}}),rows=[['Игры',t=>t.gp],['Минуты',t=>t.min],['Голы',t=>t.g],['Пасы',t=>t.a],['Голы за игру',t=>t.gp?+(t.g/t.gp).toFixed(2):0],['Гол+пас',t=>t.g+t.a]];
h+=`<div class="card"><h3>Сравнение (клубы + сборная)</h3><table><tr><th></th><th>${esc(A.name)}</th><th>${esc(B.name)}</th></tr>${rows.map(r=>{const v=ct.map(t=>r[1](t)),w=v[0]==v[1]?-1:(r[2]?(v[0]<v[1]?0:1):(v[0]>v[1]?0:1));return `<tr><td>${r[0]}</td><td${w==0?' class="w"':''}>${v[0]}</td><td${w==1?' class="w"':''}>${v[1]}</td></tr>`}).join('')}</table></div>`}
h+=rankCard()+yearList();ps.forEach(p=>{h+=clubCard(p)+natCard(p)});
$('app').innerHTML=h}
function dh(h){$('dlg').innerHTML=h;$('dlg').showModal()}
function editP(id){const p=id&&P(id)||{};dh(`<h3>${id?'Редактирование: '+esc(p.name):'Новый игрок'}</h3>${id?'<small>Это правка текущего игрока. Для нового нажмите «+ Игрок».</small>':''}<label>Имя<input id="f1" value="${esc(p.name)}"></label><label>Сборная<input id="f2" value="${esc(p.team)}"></label><label>Дата рождения<input id="f3" type="date" value="${p.birth||''}"></label><label>Дебют в футболе<input id="f4" type="date" value="${p.debut||''}"></label><label>Завершение карьеры (пусто — ещё играет)<input id="f5" type="date" value="${p.end||''}"></label><b>Клубы</b> <small>название · пришёл · ушёл</small><div id="cl"></div><button onclick="addCl()">+ клуб</button><div class="row" style="margin-top:10px"><button class="pr" onclick="saveP('${id||''}')">Сохранить</button>${id?`<button class="dg" onclick="this.textContent='Нажмите ещё раз — удалить насовсем';this.onclick=()=>delP('${id}')">Удалить</button>`:''}<button onclick="dlg.close()">Отмена</button></div>`);(p.clubs||[]).forEach(c=>addCl(c))}
function addCl(c){c=c||{};const d=document.createElement('div');d.className='cr';d.innerHTML=`<input placeholder="Клуб" value="${esc(c.n)}"><input type="date" value="${c.f||''}"><input type="date" value="${c.t||''}"><button onclick="this.parentNode.remove()">×</button>`;$('cl').appendChild(d)}
function saveP(id){const name=$('f1').value.trim();if(!name)return;const clubs=[...document.querySelectorAll('#cl .cr')].map(r=>{const i=r.querySelectorAll('input');return{n:i[0].value.trim(),f:i[1].value,t:i[2].value}}).filter(c=>c.n&&c.f).sort((a,b)=>a.f<b.f?-1:1);
let p=id&&P(id);if(!p){p={id:'p'+Date.now(),matches:[]};S.pl.push(p)}Object.assign(p,{name,team:$('f2').value.trim(),birth:$('f3').value,debut:$('f4').value,end:$('f5').value,clubs});S.a=p.id;save();dlg.close();R()}
function delP(id){S.pl=S.pl.filter(p=>p.id!==id);if(!S.pl.length)S.pl=[{id:'p'+Date.now(),name:'Новый игрок',team:'',birth:'',debut:'',end:'',clubs:[],matches:[]}];S.a=S.pl[0].id;S.b='';save();dlg.close();R()}
function addC(pid,i,k){k=k||'cs';const p=P(pid),ns=k=='ns',cy=new Date().getFullYear(),e=i>=0?p[k][i]:{y:String(cy),c:'',gp:0,min:0,g:0,a:0},yl=[];for(let y=cy;y>=1990;y--)yl.push(String(y));if(e.y&&!yl.includes(String(e.y)))yl.push(String(e.y));
const mem=ns?allTeams():allClubs(),cur=e.c||(ns&&i<0?p.team||'':''),has=mem.includes(cur);
dh(`<h3>${i>=0?'Редактировать':ns?'Статистика сборной за год':'Клубная статистика за год'} — ${esc(p.name)}</h3><label>Год<select id="c1">${yl.map(y=>`<option${y==e.y?' selected':''}>${y}</option>`).join('')}</select></label><label>${ns?'Сборная':'Клуб'}<select id="c2s" onchange="$('c2').style.display=this.value=='__new'?'block':'none'">${mem.map(c=>`<option${c==cur?' selected':''}>${esc(c)}</option>`).join('')}<option value="__new"${has?'':' selected'}>+ Новый…</option></select></label><input id="c2" placeholder="Название" value="${has?'':esc(cur)}" style="display:${has?'none':'block'};margin-bottom:6px"><label>Быстрый ввод через запятую: игры, минуты, голы, пасы<input id="qv" inputmode="numeric" placeholder="30, 2500, 12, 5" oninput="qf(this.value)"></label><div class="grid"><label>Игры<input id="c3" type="number" inputmode="numeric" placeholder="0" onfocus="this.select()" value="${i>=0?e.gp:''}"></label><label>Минуты<input id="c4" type="number" inputmode="numeric" placeholder="0" onfocus="this.select()" value="${i>=0?e.min:''}"></label><label>Голы<input id="c5" type="number" inputmode="numeric" placeholder="0" onfocus="this.select()" value="${i>=0?e.g:''}"></label><label>Пасы<input id="c6" type="number" inputmode="numeric" placeholder="0" onfocus="this.select()" value="${i>=0?e.a:''}"></label></div><div class="row" style="margin-top:10px"><button class="pr" onclick="saveC('${pid}',${i},'${k}')">Сохранить</button><button onclick="dlg.close()">Отмена</button></div>`)}
function qf(t){const v=t.split(/[\s,;]+/).filter(Boolean);['c3','c4','c5','c6'].forEach((id,i)=>{if(v[i]!==undefined)$(id).value=v[i].replace(/\D/g,'')})}
function saveC(pid,i,k){k=k||'cs';const p=P(pid),c=($('c2s').value=='__new'?$('c2').value:$('c2s').value).trim(),y=$('c1').value;if(!c||!y)return;const v={y,c,gp:n($('c3').value),min:n($('c4').value),g:n($('c5').value),a:n($('c6').value)},L=k=='ns'?MEM.t:MEM.c;if(!L.includes(c))L.push(c);p[k]=p[k]||[];if(i>=0)p[k][i]=v;else p[k].push(v);p[k].sort((a,b)=>a.y<b.y?-1:a.y>b.y?1:a.c<b.c?-1:1);save();dlg.close();R()}
function delC(pid,i,k){k=k||'cs';P(pid)[k].splice(i,1);save();R()}

init();
</script></body></html>
