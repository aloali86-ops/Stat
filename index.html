<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Футбольная статистика</title>
<style>
:root{--bg:#f3f5f7;--cd:#fff;--tx:#14202b;--mu:#6b7a88;--ac:#0a8f5b;--bd:#dde3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--cd:#18232e;--tx:#e8eef3;--mu:#8fa0af;--ac:#2fd08a;--bd:#2a3846}}
:root[data-theme="dark"]{--bg:#0f1720;--cd:#18232e;--tx:#e8eef3;--mu:#8fa0af;--ac:#2fd08a;--bd:#2a3846}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:10px;max-width:900px;margin:auto}
h1{font-size:19px;margin:4px 0}h3{margin:0 0 8px;font-size:15px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid label{font-size:12px;color:var(--mu)}
select,input,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
select,input{width:100%}button{cursor:pointer;width:auto}button.pr{background:var(--ac);color:#fff;border-color:var(--ac)}button.dg{color:#d33}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}td small{display:block;color:var(--mu);font-size:11px}
td.g{color:var(--ac);font-weight:700}td.w{color:var(--ac);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.tiles b{display:block;font-size:22px;color:var(--ac)}.tiles span{font-size:11px;color:var(--mu)}
small{color:var(--mu)}details{border-top:1px solid var(--bd);padding:6px 0}summary{cursor:pointer;padding:4px 0}dialog{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:min(440px,94vw);max-height:88vh;overflow:auto}
dialog label{display:block;margin:6px 0;font-size:12px;color:var(--mu)}.cr{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;margin:4px 0}
</style></head><body><div id="app"></div><dialog id="dlg"></dialog>
<script>
const $=id=>document.getElementById(id),K='fstats1',Z={sq:0,gp:0,min:0,g:0,a:0,yc:0,rc:0};
const MN=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=x=>parseInt(x)||0,fd=d=>d.split('-').reverse().join('.'),today=()=>new Date().toISOString().slice(0,10);
let S={pl:[],a:'',b:'',y:'',m:'',d:''};
const P=id=>S.pl.find(p=>p.id===id);
function save(){try{localStorage.setItem(K,JSON.stringify(S.pl))}catch(e){}}
const iso=s=>{s=(s||'').trim();let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=y<=40?2000:1900;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}return /^\d{4}-\d\d-\d\d$/.test(s)?s:''};
const age=(b,d)=>{let y=d.slice(0,4)-b.slice(0,4);if(d.slice(5)<b.slice(5))y--;return y};
function dur(a,b){a=new Date(a);b=new Date(b);let y=b.getUTCFullYear()-a.getUTCFullYear(),m=b.getUTCMonth()-a.getUTCMonth(),d=b.getUTCDate()-a.getUTCDate();if(d<0){m--;d+=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),0)).getUTCDate()}if(m<0){y--;m+=12}return y+' л. '+m+' мес. '+d+' дн. ('+Math.round((b-a)/864e5)+' дн.)'}
function clubOf(p,m){if(m.nat)return p.team||'Сборная';for(const c of p.clubs||[])if(c.f<=m.d&&(!c.t||m.d<=c.t))return c.n;return 'Без клуба'}
function agg(ms){return ms.reduce((r,m)=>{r.sq++;if(m.min>0)r.gp++;r.min+=m.min;r.g+=m.g;r.a+=m.a;r.yc+=m.yc;r.rc+=m.rc;return r},Object.assign({},Z))}
function importText(p,txt,nat){const L=txt.split(/\r?\n/).slice(1);let c=0;L.forEach(l=>{if(!l.trim())return;const r=[];let q=0,s='';for(const ch of l){if(ch=='"')q=!q;else if(ch==','&&!q){r.push(s);s=''}else s+=ch}r.push(s);const d=iso(r[1]);if(!d)return;if(/^\d+:\d+/.test((r[3]||'').trim()))return;if(p.matches.some(m=>m.d==d&&m.o==r[3]))return;p.matches.push({d,t:r[0],ha:r[2],o:r[3],sc:r[4],g:n(r[6]),a:n(r[7]),yc:n(r[8])+n(r[9]),rc:n(r[10]),min:n(r[11]),note:r[12]=='-'?'':(r[12]||''),nat});c++});p.matches.sort((a,b)=>a.d<b.d?-1:1);if(!p.debut&&p.matches.length)p.debut=p.matches[0].d;return c}
const SEED='Турнир,Дата,Дома/Гости,Противник,Счёт,Амплуа,Гол,Пас,ЖК,2 ЖК,КК,Минут,Примечание (C)\nТоварищеские матчи,21.08.03,Д,Казахстан,1:0,ПВ,-,-,-,-,-,45\',-\nТоварищеские матчи,06.09.03,Д,Испания,0:3,-,-,-,-,-,-,-,C U21\nТоварищеские матчи,10.09.03,Г,Норвегия,0:1,-,-,-,-,-,-,-,C U21\nТоварищеские матчи,11.10.03,Д,Албания,5:3,ПВ,-,-,-,-,-,45\',-\nТоварищеские матчи,15.11.03,Д,Греция,1:1,-,-,-,-,-,-,-,C U21\nТоварищеские матчи,19.11.03,Г,Кувейт,0:8,-,-,-,-,-,-,-,C U21';
function init(){try{S.pl=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}if(!S.pl.length){const p={id:'p1',name:'Cr',team:'',birth:'',debut:'',end:'',clubs:[],matches:[]};importText(p,SEED,true);S.pl=[p]}S.pl.forEach(p=>p.matches=p.matches.filter(m=>!/^\d+:\d+/.test(String(m.o||'').trim())));save();S.a=S.pl[0].id;R()}
const sel=(id,opts,v,fn)=>`<select onchange="${fn}">${opts.map(o=>`<option value="${esc(o[0])}"${o[0]==v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
function info(p){const t=today(),e=p.end||t;return `<div><b>${esc(p.name)}</b> · ${esc(p.team||'—')}<br><small>Рожд.: ${p.birth?fd(p.birth)+' ('+age(p.birth,t)+' л.)':'—'} · Дебют: ${p.debut?fd(p.debut)+(p.birth?' ('+age(p.birth,p.debut)+' л.)':''):'—'} · ${p.end?'Завершил: '+fd(p.end):'Играет'}${p.debut?'<br>В карьере: '+dur(p.debut,e):''}</small></div>`}
function T(title,keys,maps,ps,lab,sub){const two=ps.length>1,cols=two?[['gp','И'],['g','Г'],['a','П']]:[['gp','Игры'],['min','Мин'],['g','Голы'],['a','Пасы'],['yc','ЖК']];
if(!keys.length)return `<div class="card"><h3>${title}</h3><small>Нет данных</small></div>`;
let h=`<div class="card"><h3>${title}</h3><div class="sc"><table>`;if(two)h+=`<tr><th></th>${ps.map(p=>`<th colspan="3">${esc(p.name)}</th>`).join('')}</tr>`;
h+=`<tr><th></th>${ps.map(()=>cols.map(c=>`<th>${c[1]}</th>`).join('')).join('')}</tr>`;
keys.forEach(k=>{h+=`<tr><td>${lab(k)}${sub?`<small>${sub(k)}</small>`:''}</td>${maps.map(mp=>{const a=mp.get(k)||Z;return cols.map(c=>`<td${c[0]=='g'&&a.g?' class="g"':''}>${a[c[0]]}</td>`).join('')}).join('')}</tr>`});
return h+'</table></div></div>'}
const csF=p=>(p.cs||[]).filter(e=>!S.y||String(e.y).slice(0,4)==S.y);
const csT=v=>v.reduce((r,e)=>{for(const k in r)r[k]+=n(e[k]);return r},{gp:0,min:0,g:0,a:0,yc:0,yc2:0,rc:0});
function yearCard(p){const Y=new Map(),get=y=>{if(!Y.has(y))Y.set(y,{gp:0,min:0,g:0,a:0,cg:0,ng:0});return Y.get(y)};
p.matches.forEach(m=>{const r=get(m.d.slice(0,4));if(m.min>0)r.gp++;r.min+=m.min;r.g+=m.g;r.a+=m.a;r.ng+=m.g});
(p.cs||[]).forEach(e=>{const r=get(String(e.y).slice(0,4));r.gp+=n(e.gp);r.min+=n(e.min);r.g+=n(e.g);r.a+=n(e.a);r.cg+=n(e.g)});
const ks=[...Y.keys()].sort(),best=ks.reduce((b,k)=>{if(b===null)return k;const x=Y.get(k),y=Y.get(b);return x.g>y.g||(x.g==y.g&&x.a>y.a)?k:b},null);
return `<div class="card"><h3>По годам: клубы + сборная — ${esc(p.name)}</h3>`+(ks.length?`<div class="sc"><table><tr><th>Год</th><th>Игры</th><th>Мин</th><th>Голы</th><th>Пасы</th></tr>${ks.map(k=>{const r=Y.get(k),b=k===best&&r.g+r.a>0;return `<tr${b?' style="background:rgba(47,175,120,.15)"':''}><td>${b?'🏆 ':''}${k}<small>клубы ${r.cg} г · сборная ${r.ng} г</small></td><td>${r.gp}</td><td>${r.min}</td><td${r.g?' class="g"':''}>${r.g}</td><td>${r.a}</td></tr>`}).join('')}</table></div><small>🏆 — лучший год: больше всего голов, при равенстве — пасов.</small>`:'<small>Нет данных</small>')+'</div>'}
function clubCard(p){const cs=csF(p),mp=new Map();cs.forEach(e=>{if(!mp.has(e.c))mp.set(e.c,[]);mp.get(e.c).push(e)});
return `<div class="card"><h3>Клубы — ${esc(p.name)}</h3>`+(mp.size?[...mp].map(([c,v],i)=>{const t=csT(v),pr=(p.clubs||[]).find(x=>x.n==c);return `<details${i==0?' open':''}><summary><b>${esc(c)}</b> · игр ${t.gp} · голов ${t.g} · пасов ${t.a}${pr?'<small> '+fd(pr.f)+' – '+(pr.t?fd(pr.t):'н.в.')+'</small>':''}</summary><div class="sc"><table><tr><th>Год</th><th>И</th><th>Мин</th><th>Г</th><th>П</th><th>ЖК</th><th>2ЖК</th><th>КК</th><th></th></tr>${v.map(e=>`<tr><td>${esc(e.y)}</td><td>${e.gp}</td><td>${e.min}</td><td${e.g?' class="g"':''}>${e.g}</td><td>${e.a}</td><td>${e.yc}</td><td>${e.yc2}</td><td>${e.rc}</td><td style="white-space:nowrap"><button onclick="addC('${p.id}',${p.cs.indexOf(e)})">✎</button> <button onclick="delC('${p.id}',${p.cs.indexOf(e)})">×</button></td></tr>`).join('')}<tr><td><b>Итого</b></td><td><b>${t.gp}</b></td><td><b>${t.min}</b></td><td><b>${t.g}</b></td><td><b>${t.a}</b></td><td><b>${t.yc}</b></td><td><b>${t.yc2}</b></td><td><b>${t.rc}</b></td><td></td></tr></table></div></details>`}).join(''):'<small>Нет данных. Нажмите «+ Клуб» и внесите статистику за год.</small>')+'</div>'}
function R(){if(!P(S.a))S.a=S.pl[0].id;const A=P(S.a),B=S.b&&S.b!==S.a?P(S.b):null,ps=B?[A,B]:[A];
const all=ps.flatMap(p=>p.matches),ys=[...new Set(all.map(m=>m.d.slice(0,4)).concat(ps.flatMap(p=>(p.cs||[]).map(e=>String(e.y).slice(0,4)))))].sort(),ds=[...new Set(all.map(m=>m.d.slice(8)))].sort();
if(S.y&&!ys.includes(S.y))S.y='';if(S.d&&!ds.includes(S.d))S.d='';
const ms=ps.map(p=>p.matches.filter(m=>(!S.y||m.d.slice(0,4)==S.y)&&(!S.m||m.d.slice(5,7)==S.m)&&(!S.d||m.d.slice(8)==S.d)));
const G=fn=>{const maps=ps.map((p,i)=>{const mp=new Map();ms[i].forEach(x=>{const k=fn(x,p);if(k===null)return;if(!mp.has(k))mp.set(k,[]);mp.get(k).push(x)});mp.forEach((v,k)=>mp.set(k,agg(v)));return mp});return{maps,keys:[...new Set(maps.flatMap(m=>[...m.keys()]))]}};
const tot=ms.map(agg);let h=`<div class="row" style="justify-content:space-between"><h1>⚽ Статистика</h1><div class="row"><button class="pr" onclick="editP()">+ Игрок</button><button onclick="addM()">+ Матч</button><button onclick="addC(S.a,-1)">+ Клуб</button><button onclick="impD()">CSV</button><button onclick="editP(S.a)">✎</button></div></div>
<div class="row" style="margin:6px 0">${S.pl.map(p=>`<button class="${p.id==S.a?'pr':''}" onclick="S.a='${p.id}';S.b='';R()">${esc(p.name)}</button>`).join('')}</div><div class="card grid"><label>Игрок${sel('a',S.pl.map(p=>[p.id,p.name]),S.a,'S.a=this.value;R()')}</label><label>Сравнить с${sel('b',[['','—']].concat(S.pl.filter(p=>p.id!==S.a).map(p=>[p.id,p.name])),S.b,'S.b=this.value;R()')}</label>
<label>Год${sel('y',[['','Все']].concat(ys.map(y=>[y,y])),S.y,'S.y=this.value;R()')}</label><label>Месяц${sel('m',[['','Все']].concat(MN.map((x,i)=>[String(i+1).padStart(2,'0'),x])),S.m,'S.m=this.value;R()')}</label>
<label>День${sel('d',[['','Все']].concat(ds.map(d=>[d,d])),S.d,'S.d=this.value;R()')}</label><label>&nbsp;<button onclick="S.y=S.m=S.d='';R()" style="width:100%">Сбросить</button></label></div>`;
ps.forEach((p,i)=>{const t=tot[i],q=csT(csF(p));h+=`<div class="card">${info(p)}<div class="tiles" style="margin-top:10px"><div><b>${t.gp}</b><span>игры</span></div><div><b>${t.min}</b><span>минуты</span></div><div><b>${t.g}</b><span>голы</span></div><div><b>${t.a}</b><span>пасы</span></div></div><small>В заявке: ${t.sq} · ЖК ${t.yc} · КК ${t.rc}</small>${(p.cs||[]).length?`<br><small>Клубы: игр ${q.gp} · голов ${q.g} · пасов ${q.a} · Клубы+сборная: игр ${q.gp+t.gp} · голов ${q.g+t.g} · пасов ${q.a+t.a}</small>`:''}</div>`});
if(B){const rows=[['Игры',t=>t.gp],['Минуты',t=>t.min],['Голы',t=>t.g],['Пасы',t=>t.a],['Голы за игру',t=>t.gp?+(t.g/t.gp).toFixed(2):0],['Гол+пас',t=>t.g+t.a],['ЖК',t=>t.yc,1],['КК',t=>t.rc,1]];
h+=`<div class="card"><h3>Сравнение</h3><table><tr><th></th><th>${esc(A.name)}</th><th>${esc(B.name)}</th></tr>${rows.map(r=>{const v=tot.map(t=>r[1](t)),w=v[0]==v[1]?-1:(r[2]?(v[0]<v[1]?0:1):(v[0]>v[1]?0:1));return `<tr><td>${r[0]}</td><td${w==0?' class="w"':''}>${v[0]}</td><td${w==1?' class="w"':''}>${v[1]}</td></tr>`}).join('')}</table></div>`}
ps.forEach(p=>{h+=yearCard(p)});const mode=!S.y?0:!S.m?1:2,g1=G(x=>mode==0?x.d.slice(0,4):mode==1?x.d.slice(5,7):x.d);g1.keys.sort();
h+=T(['По годам','По месяцам '+S.y,'По дням'][mode],g1.keys,g1.maps,ps,k=>mode==0?k:mode==1?MN[k-1]:fd(k));
const g4=G(x=>x.d.slice(5,7));g4.keys.sort();h+=T('По месяцам (голы и пасы)',g4.keys,g4.maps,ps,k=>MN[k-1]);const WD=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];const g5=G(x=>(new Date(x.d+'T00:00:00Z').getUTCDay()+6)%7);g5.keys.sort((a,b)=>a-b);h+=T('По дням недели (голы и пасы)',g5.keys,g5.maps,ps,k=>WD[k]);
const g2=G((x,p)=>p.birth?age(p.birth,x.d):null);g2.keys.sort((a,b)=>a-b);
h+=ps.every(p=>p.birth)?T('По возрасту',g2.keys,g2.maps,ps,k=>k+' лет'):`<div class="card"><h3>По возрасту</h3><small>Укажите дату рождения игрока (✎), чтобы увидеть статистику по возрасту.</small></div>`;
ps.forEach(p=>{h+=clubCard(p)});
const rowM=m=>`<tr><td>${fd(m.d)}<small>${esc(m.note||m.t||'')}</small></td><td>${esc(m.o)}${m.nat?'':'<small>'+esc(clubOf(A,m))+'</small>'}</td><td>${esc(m.sc)}</td><td>${m.min}</td><td>${m.g}</td><td>${m.a}</td><td style="white-space:nowrap"><button onclick="addM(${A.matches.indexOf(m)})">✎</button> <button onclick="delM(${A.matches.indexOf(m)})">×</button></td></tr>`;
const grp=(list,kf,title)=>{const mp=new Map();list.forEach(m=>{const k=kf(m);if(!mp.has(k))mp.set(k,[]);mp.get(k).push(m)});const keys=[...mp.keys()].sort().reverse();return `<div class="card"><h3>${title} — ${esc(A.name)}</h3>`+(keys.length?keys.map((k,i)=>{const v=mp.get(k),t=agg(v);return `<details${i==0?' open':''}><summary><b>${k}</b> · игр ${t.gp} · голов ${t.g} · пасов ${t.a}</summary><div class="sc"><table><tr><th>Дата</th><th>Соперник</th><th>Счёт</th><th>Мин</th><th>Г</th><th>П</th><th></th></tr>${v.slice().sort((a,b)=>a.d<b.d?1:-1).map(rowM).join('')}</table></div></details>`}).join(''):'<small>Нет матчей</small>')+'</div>'};
const season=m=>{const y=+m.d.slice(0,4),mo=+m.d.slice(5,7),s=mo>=7?y:y-1;return s+'/'+String(s+1).slice(2)};
h+=grp(ms[0].filter(m=>m.nat),m=>m.d.slice(0,4),'Сборная по годам')+(ms[0].some(m=>!m.nat)?grp(ms[0].filter(m=>!m.nat),season,'Матчи клубов по сезонам'):'');
$('app').innerHTML=h}
function dh(h){$('dlg').innerHTML=h;$('dlg').showModal()}
function editP(id){const p=id&&P(id)||{};dh(`<h3>${id?'Редактирование: '+esc(p.name):'Новый игрок'}</h3>${id?'<small>Это правка текущего игрока. Для нового нажмите «+ Игрок».</small>':''}<label>Имя<input id="f1" value="${esc(p.name)}"></label><label>Сборная<input id="f2" value="${esc(p.team)}"></label><label>Дата рождения<input id="f3" type="date" value="${p.birth||''}"></label><label>Дата дебюта<input id="f4" type="date" value="${p.debut||''}"></label><label>Завершил карьеру (пусто — играет)<input id="f5" type="date" value="${p.end||''}"></label><b>Клубы</b> <small>название · пришёл · ушёл</small><div id="cl"></div><button onclick="addCl()">+ клуб</button><div class="row" style="margin-top:10px"><button class="pr" onclick="saveP('${id||''}')">Сохранить</button>${id?`<button class="dg" onclick="this.textContent='Нажмите ещё раз — удалить насовсем';this.onclick=()=>delP('${id}')">Удалить</button>`:''}<button onclick="dlg.close()">Отмена</button></div>`);(p.clubs||[]).forEach(c=>addCl(c))}
function addCl(c){c=c||{};const d=document.createElement('div');d.className='cr';d.innerHTML=`<input placeholder="Клуб" value="${esc(c.n)}"><input type="date" value="${c.f||''}"><input type="date" value="${c.t||''}"><button onclick="this.parentNode.remove()">×</button>`;$('cl').appendChild(d)}
function saveP(id){const name=$('f1').value.trim();if(!name)return;const clubs=[...document.querySelectorAll('#cl .cr')].map(r=>{const i=r.querySelectorAll('input');return{n:i[0].value.trim(),f:i[1].value,t:i[2].value}}).filter(c=>c.n&&c.f).sort((a,b)=>a.f<b.f?-1:1);
let p=id&&P(id);if(!p){p={id:'p'+Date.now(),matches:[]};S.pl.push(p)}Object.assign(p,{name,team:$('f2').value.trim(),birth:$('f3').value,debut:$('f4').value,end:$('f5').value,clubs});S.a=p.id;save();dlg.close();R()}
function delP(id){S.pl=S.pl.filter(p=>p.id!==id);if(!S.pl.length)S.pl=[{id:'p'+Date.now(),name:'Новый игрок',team:'',birth:'',debut:'',end:'',clubs:[],matches:[]}];S.a=S.pl[0].id;S.b='';save();dlg.close();R()}
function addM(i){const p=P(S.a),m=i>=0?p.matches[i]:{d:today(),t:'',o:'',sc:'',min:90,g:0,a:0,yc:0,rc:0,nat:false};dh(`<h3>${i>=0?'Редактировать матч':'Новый матч'} — ${esc(p.name)}</h3><label>Дата<input id="m1" type="date" value="${m.d}"></label><label>Турнир<input id="m2" value="${esc(m.t)}"></label><label>Соперник<input id="m3" value="${esc(m.o)}"></label><label>Счёт<input id="m4" placeholder="2:1" value="${esc(m.sc)}"></label><div class="grid"><label>Минуты<input id="m5" type="number" value="${m.min}"></label><label>Голы<input id="m6" type="number" value="${m.g}"></label><label>Пасы<input id="m7" type="number" value="${m.a}"></label><label>ЖК<input id="m8" type="number" value="${m.yc}"></label><label>КК<input id="m9" type="number" value="${m.rc}"></label><label>За<select id="m0"><option value="0"${m.nat?'':' selected'}>Клуб (по датам)</option><option value="1"${m.nat?' selected':''}>Сборную</option></select></label></div><div class="row" style="margin-top:10px"><button class="pr" onclick="saveM(${i>=0?i:-1})">Сохранить</button><button onclick="dlg.close()">Отмена</button></div>`)}
function saveM(i){const d=$('m1').value;if(!d)return;const p=P(S.a),v={d,t:$('m2').value,o:$('m3').value,sc:$('m4').value,min:n($('m5').value),g:n($('m6').value),a:n($('m7').value),yc:n($('m8').value),rc:n($('m9').value),nat:$('m0').value=='1'};if(i>=0)Object.assign(p.matches[i],v);else p.matches.push(v);p.matches.sort((a,b)=>a.d<b.d?-1:1);save();dlg.close();R()}
function addC(pid,i){const p=P(pid),e=i>=0?p.cs[i]:{y:String(new Date().getFullYear()),c:'',gp:0,min:0,g:0,a:0,yc:0,yc2:0,rc:0},dl=[...new Set((p.cs||[]).map(x=>x.c).concat((p.clubs||[]).map(c=>c.n)))].map(c=>`<option value="${esc(c)}">`).join('');dh(`<h3>${i>=0?'Редактировать':'Клубная статистика за год'} — ${esc(p.name)}</h3><label>Год (2003 или 2003/04)<input id="c1" value="${esc(e.y)}"></label><label>Клуб<input id="c2" list="cdl" value="${esc(e.c)}"></label><datalist id="cdl">${dl}</datalist><div class="grid"><label>Игры<input id="c3" type="number" value="${e.gp}"></label><label>Минуты<input id="c4" type="number" value="${e.min}"></label><label>Голы<input id="c5" type="number" value="${e.g}"></label><label>Пасы<input id="c6" type="number" value="${e.a}"></label><label>ЖК<input id="c7" type="number" value="${e.yc}"></label><label>2 ЖК<input id="c8" type="number" value="${e.yc2}"></label><label>КК<input id="c9" type="number" value="${e.rc}"></label></div><div class="row" style="margin-top:10px"><button class="pr" onclick="saveC('${pid}',${i})">Сохранить</button><button onclick="dlg.close()">Отмена</button></div>`)}
function saveC(pid,i){const p=P(pid),c=$('c2').value.trim(),y=$('c1').value.trim();if(!c||!y)return;const v={y,c,gp:n($('c3').value),min:n($('c4').value),g:n($('c5').value),a:n($('c6').value),yc:n($('c7').value),yc2:n($('c8').value),rc:n($('c9').value)};p.cs=p.cs||[];if(i>=0)p.cs[i]=v;else p.cs.push(v);p.cs.sort((a,b)=>a.y<b.y?-1:a.y>b.y?1:a.c<b.c?-1:1);save();dlg.close();R()}
function delC(pid,i){P(pid).cs.splice(i,1);save();R()}
function delM(i){P(S.a).matches.splice(i,1);save();R()}
function impD(){dh(`<h3>Импорт CSV — ${esc(P(S.a).name)}</h3><small>Колонки: Турнир, Дата, Дома/Гости, Противник, Счёт, Амплуа, Гол, Пас, ЖК, 2 ЖК, КК, Минут, Примечание</small><label>Файл<input id="fi" type="file" accept=".csv,text/csv"></label><label>Матчи за<select id="ft"><option value="1">Сборную</option><option value="0">Клуб (по датам)</option></select></label><div class="row"><button class="pr" onclick="doImp()">Импорт</button><button onclick="dlg.close()">Отмена</button></div>`)}
function doImp(){const f=$('fi').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{importText(P(S.a),r.result,$('ft').value=='1');save();dlg.close();R()};r.readAsText(f,'utf-8')}
init();
</script></body></html>
